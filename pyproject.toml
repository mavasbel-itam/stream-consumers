[project]
name = "stream-consumers"
version = "0.1.0"
description = "Consumers and subscribers for public real-time data streams (COM-22102 final-project research)."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aiohttp==3.14.5",
    "websockets==15.0.1",
    "paho-mqtt==2.1.0",
    "pyzmq==27.2.0",
    "nats-py==2.16.0",
    "aiokafka==0.14.0",
    "pyais==3.3.1",
    "gtfs-realtime-bindings==3.0.0",
    "protobuf==7.36.2",
    "cryptography==50.0.2",
    "fastavro==1.13.1",
]

[project.scripts]
stream-consumers = "stream_consumers.adapters.inbound.cli:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "coverage==7.16.2",
    "amqtt==0.12.1",
    "ruff==0.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stream_consumers"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/component"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers"
markers = [
    "live: reads the real providers over the Internet (run with: pytest tests/live -m live)",
    "e2e: runs the CLI in a subprocess against local servers",
]

[tool.coverage.run]
source = ["stream_consumers"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false
exclude_also = ["if TYPE_CHECKING:"]

[tool.ruff]
line-length = 140
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "E501"]  # long lines: the formatter wraps code; descriptor notes stay one string
