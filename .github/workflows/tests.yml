name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --locked
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run pytest --cov
      - run: uv run coverage erase --rcfile=.coveragerc.e2e
      - run: uv run pytest tests/e2e
      - run: uv run coverage combine --rcfile=.coveragerc.e2e
      - run: uv run coverage report --rcfile=.coveragerc.e2e
